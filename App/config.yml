# ===================================================================
# 📱 XAuth App Target Configuration
# ===================================================================
# Berkas ini mendefinisikan target utama aplikasi iOS (XAuth.app)
# beserta skema-skema eksekusi (Staging/Production Debug & Release).
# ===================================================================

targets:

  XAuth:
    type: application # Tipe target berupa aplikasi iOS utama
    platform: iOS
    deploymentTarget: 16.0

    sources:
      # Berkas kode, Info.plist, GoogleServices, Entitlements dan xcconfig
      - path: Sources
        group: App
      - path: Resources
        group: App
      - path: Configs/xcconfig
        group: App/Configs
      - path: Configs/entitlements
        group: App/Configs
      - path: Configs/google
        group: App/Configs
      - path: Configs/Info.plist
        group: App/Configs

    resources:
      # Aset katalog (Gambar, warna, ikon aplikasi)
      - path: Resources/Assets.xcassets
      - path: Resources/Colors.xcassets

    # Menggunakan xcconfig file eksternal untuk konfigurasi build settings
    configFiles:
      Staging Debug: Configs/xcconfig/Staging-Debug.xcconfig
      Staging Release: Configs/xcconfig/Staging-Release.xcconfig
      Production Debug: Configs/xcconfig/Production-Debug.xcconfig
      Production Release: Configs/xcconfig/Production-Release.xcconfig

    settings:
      base:
        INFOPLIST_FILE: App/Configs/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        OTHER_SWIFT_FLAGS: $(inherited)

    dependencies:
      # Internal Target Dependencies (Modul kit pendukung)
      - target: XAuthKit
      - target: XAuthUIKit
      - target: XAuthCommunicationsKit

      # Swift Package Manager (SPM) Dependencies dari packages.yml
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Factory
        product: FactoryKit

    # Script pre-compile kustom khusus target aplikasi utama
    preCompileScripts:
      - name: Run SwiftLint
        basedOnDependencyAnalysis: false # Selalu dijalankan setiap kali kompilasi build berlangsung
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint >/dev/null; then
            swiftlint lint --config .swiftlint.yml
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi

# Skema Xcode utama yang dapat dipilih oleh developer di menu Xcode Scheme
schemes:

  # 1. Scheme Staging Debug (Untuk uji coba lokal internal dengan server Staging)
  XAuth Staging Debug:
    build:
      targets:
        XAuth: all
    run:
      config: Staging Debug
      commandLineArguments:
        -FIRAnalyticsDebugEnabled: true # Memaksa log Firebase Analytics langsung dikirim saat run
    test:
      config: Staging Debug
    profile:
      config: Staging Debug
    analyze:
      config: Staging Debug
    archive:
      config: Staging Debug

  # 2. Scheme Production Debug (Untuk uji coba lokal internal dengan server Production)
  XAuth Production Debug:
    build:
      targets:
        XAuth: all
    run:
      config: Production Debug
      commandLineArguments:
        -FIRAnalyticsDebugEnabled: true
    test:
      config: Production Debug
    profile:
      config: Production Debug
    analyze:
      config: Production Debug
    archive:
      config: Production Debug

  # 3. Scheme Staging Release (Untuk pembuatan build rilis staging)
  XAuth Staging Release:
    build:
      targets:
        XAuth: all
    run:
      config: Staging Release
    test:
      config: Staging Release
    profile:
      config: Staging Release
    analyze:
      config: Staging Release
    archive:
      config: Staging Release

  # 4. Scheme Production Release (Untuk pembuatan build rilis production ke App Store)
  XAuth Production Release:
    build:
      targets:
        XAuth: all
    run:
      config: Production Release
    test:
      config: Production Release
    profile:
      config: Production Release
    analyze:
      config: Production Release
    archive:
      config: Production Release
