
############
# Configs
############

configs:
  Staging Debug: debug
  Production Debug: debug
  Staging Release: release
  Production Release: release


targets:

  ############
  # Application
  ############

  KompasIdAuth:
    type: application
    platform: iOS
    deploymentTarget: 16.0

    sources:
      - path: Sources
        group: App
      - path: Resources
        group: App
      - path: Configs/xcconfig
        group: App/Configs
      - path: Configs/entitlements
        group: App/Configs
      - path: Configs/google
        group: App/Configs
      - path: Configs/Info.plist
        group: App/Configs

    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Colors.xcassets

    configFiles:
      Staging Debug: Configs/xcconfig/Staging-Debug.xcconfig
      Staging Release: Configs/xcconfig/Staging-Release.xcconfig
      Production Debug: Configs/xcconfig/Production-Debug.xcconfig
      Production Release: Configs/xcconfig/Production-Release.xcconfig

    settings:
      DEBUG_INFORMATION_FORMAT: $(MYAPP_DEBUG_INFORMATION_FORMAT)
      base:
        INFOPLIST_FILE: App/Configs/Info.plist
        PRODUCT_NAME: $(MY_PRODUCT_NAME)
        CF_BUNDLE_DISPLAY_NAME: $(MY_CF_BUNDLE_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(MY_PRODUCT_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(MY_ASSETCATALOG_COMPILER_APPICON_NAME)
        CODE_SIGN_ENTITLEMENTS: $(MY_CODE_SIGN_ENTITLEMENTS)
        DEVELOPMENT_TEAM: $(MY_DEVELOPMENT_TEAM)
        MARKETING_VERSION: $(MY_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(MY_CURRENT_PROJECT_VERSION)
        CODE_SIGN_STYLE: $(MY_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(MY_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(MY_PROVISIONING_PROFILE_SPECIFIER)
        OTHER_SWIFT_FLAGS: 
          - $(inherited)
          
    info:
      properties:
        CFBundleDevelopmentRegion: $(MY_DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(MY_EXECUTABLE_NAME)
        CFBundleInfoDictionaryVersion: "6.0"
        
        # --- Menggunakan Variabel dari Build Settings (yang terhubung ke xcconfig) ---
        CFBundleName: $(MY_PRODUCT_NAME)
        CFBundleIdentifier: $(MY_PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MY_MARKETING_VERSION)
        CFBundleVersion: $(MY_CURRENT_PROJECT_VERSION)
        # ---
        
        CFBundlePackageType: $(MY_PRODUCT_BUNDLE_PACKAGE_TYPE)
        
        # --- Permissions & Security ---
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: $(MY_NS_CAMERA_USAGE_DESCRIPTION)
        NSLocationAlwaysAndWhenInUseUsageDescription: $(MY_NS_LOCATION_ALWAYS_AND_WHEN_IN_USE_USAGE_DESCRIPTION)
        NSLocationWhenInUseUsageDescription: $(MY_NS_LOCATION_WHEN_IN_USE_USAGE_DESCRIPTION)
        NSMicrophoneUsageDescription: $(MY_NS_MICROPHONE_USAGE_DESCRIPTION)
        NSPhotoLibraryUsageDescription: $(MY_NS_PHOTO_LIBRARY_USAGE_DESCRIPTION)
        NSUserTrackingUsageDescription: $(MY_NS_USER_TRACKING_USAGE_DESCRIPTION)
        
        # --- Fonts (UIAppFonts) ---
        UIAppFonts:
          - PTSans-Bold.ttf
          - PTSans-BoldItalic.ttf
          - PTSans-Italic.ttf
          - PTSans-Regular.ttf
          - Lora-Bold.ttf
          - Lora-BoldItalic.ttf
          - Lora-Italic.ttf
          - Lora-Medium.ttf
          - Lora-MediumItalic.ttf
          - Lora-Regular.ttf
          - Lora-SemiBold.ttf
          - Lora-SemiBoldItalic.ttf
          - PlayFairDisplay-Bold.ttf
          - PlayfairDisplay-BoldItalic.ttf
          - PlayfairDisplay-Italic.ttf
          - PlayfairDisplay-Regular.ttf
          - PlayfairDisplay-SemiBold.ttf
          - PlayfairDisplay-SemiBoldItalic.ttf
          - Hind-Bold.ttf
          - Hind-Light.ttf
          - Hind-Medium.ttf
          - Hind-Regular.ttf
          - Hind-SemiBold.ttf
        
        # --- App Scene & Background ---
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
          
        # --- UI/Launch ---
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        
        # --- Orientations (Gunakan tanda kutip karena ada ~) ---
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait

    dependencies:

      # Internal Dependencies
      - target: UICore
      - target: CommunicationsCore

      # SPM dependencies
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics

    scheme:
      configVariants:
        - Staging
        - Production
      commandLineArguments:
        -FIRAnalyticsDebugEnabled: true
        -FIRDebugDisabled: true

