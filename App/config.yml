
############
# Configs
############

configs:
  Staging Debug: debug
  Production Debug: debug
  Staging Release: release
  Production Release: release


targets:

  ############
  # Application
  ############

  KompasIdAuth:
    type: application
    platform: iOS
    deploymentTarget: 16.0

    sources:
      - path: Sources
        group: App
      - path: Resources
        group: App
      - path: Configs/xcconfig
        group: App/Configs
      - path: Configs/entitlements
        group: App/Configs
      - path: Configs/google
        group: App/Configs
      - path: Configs/Info.plist
        group: App/Configs

    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Colors.xcassets

    configFiles:
      Staging Debug: Configs/xcconfig/Staging-Debug.xcconfig
      Staging Release: Configs/xcconfig/Staging-Release.xcconfig
      Production Debug: Configs/xcconfig/Production-Debug.xcconfig
      Production Release: Configs/xcconfig/Production-Release.xcconfig

    settings:
      base:
        INFOPLIST_FILE: App/Configs/Info.plist

        CF_BUNDLE_DEVELOPMENT_REGION: $(CF_BUNDLE_DEVELOPMENT_REGION)
        CF_BUNDLE_EXECUTABLE: $(CF_BUNDLE_EXECUTABLE)
        CF_BUNDLE_IDENTIFIER: $(CF_BUNDLE_IDENTIFIER)
        CF_BUNDLE_DISPLAY_NAME: $(CF_BUNDLE_DISPLAY_NAME)
        CF_BUNDLE_INFO_DICTIONARY_VERSION: $(CF_BUNDLE_INFO_DICTIONARY_VERSION)
        CF_BUNDLE_NAME: $(CF_BUNDLE_NAME)
        CF_BUNDLE_PACKAGE_TYPE: $(CF_BUNDLE_PACKAGE_TYPE)
        CF_BUNDLE_SHORT_VERSION_STRING: $(CF_BUNDLE_SHORT_VERSION_STRING)
        CF_BUNDLE_VERSION: $(CF_BUNDLE_VERSION)
        CODE_SIGN_STYLE: $(CODE_SIGN_STYLE)
        DEBUG_INFORMATION_FORMAT: $(DEBUG_INFORMATION_FORMAT)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(ASSETCATALOG_COMPILER_APPICON_NAME)

        CODE_SIGN_ENTITLEMENTS: $(CODE_SIGN_ENTITLEMENTS)
        APP_STORE_CONNECT_TEAM_ID: $(APP_STORE_CONNECT_TEAM_ID)
        DEVELOPER_PORTAL_TEAM_ID: $(DEVELOPER_PORTAL_TEAM_ID)
        CODE_SIGN_IDENTITY: $(CODE_SIGN_IDENTITY)

        NS_CAMERA_USAGE_DESCRIPTION: $(NS_CAMERA_USAGE_DESCRIPTION)
        NS_LOCATION_ALWAYS_AND_WHEN_IN_USE_USAGE_DESCRIPTION: $(NS_LOCATION_ALWAYS_AND_WHEN_IN_USE_USAGE_DESCRIPTION)
        NS_LOCATION_WHEN_IN_USE_USAGE_DESCRIPTION: $(NS_LOCATION_WHEN_IN_USE_USAGE_DESCRIPTION)
        NS_MICROPHONE_USAGE_DESCRIPTION: $(NS_MICROPHONE_USAGE_DESCRIPTION)
        NS_PHOTO_LIBRARY_USAGE_DESCRIPTION: $(NS_PHOTO_LIBRARY_USAGE_DESCRIPTION)
        NS_USER_TRACKING_USAGE_DESCRIPTION: $(NS_USER_TRACKING_USAGE_DESCRIPTION)

        OTHER_SWIFT_FLAGS: 
          - $(inherited)
          
    dependencies:

      # Internal Dependencies
      - target: UICore
      - target: CommunicationsCore

      # SPM dependencies
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics

    scheme:
      configVariants:
        - Staging
        - Production
      commandLineArguments:
        -FIRAnalyticsDebugEnabled: true
        # -FIRDebugDisabled: true

