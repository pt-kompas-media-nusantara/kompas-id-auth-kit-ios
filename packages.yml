# ===================================================================
# 📦 XcodeGen Packages Dependency Configuration
# ===================================================================
# Berkas ini mendefinisikan seluruh external package dependencies
# menggunakan Swift Package Manager (SPM) untuk proyek ini.
# ===================================================================

packages:

  # Firebase iOS SDK untuk Analytics, Crashlytics, dll.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    version: 12.6.0

  # SwiftLint Plugins untuk analisis kualitas kode static analyzer.
  SwiftLintPlugins:
    url: https://github.com/realm/SwiftLint.git
    version: 0.62.2

  # Kompas Mobile Net Data Library untuk utilitas jaringan & otentikasi
  NetDataLibrary:
    url: https://github.com/pt-kompas-media-nusantara/kompas-mobile-netdatalibrary.git
    version: 1.0.94

  # Factory Dependency Injection library untuk Swift
  Factory:
    url: https://github.com/hmlongco/Factory.git
    version: 3.2.1
