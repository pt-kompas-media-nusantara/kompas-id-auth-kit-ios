# ===================================================================
# 📦 XcodeGen Packages Dependency Configuration
# ===================================================================
# Berkas ini mendefinisikan seluruh external package dependencies
# menggunakan Swift Package Manager (SPM) untuk proyek ini.
# ===================================================================

packages:

  # Firebase iOS SDK untuk Analytics, Crashlytics, dll.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    version: 12.6.0

  # SwiftLint Plugins untuk analisis kualitas kode static analyzer.
  SwiftLintPlugins:
    url: https://github.com/realm/SwiftLint.git
    version: 0.62.2
