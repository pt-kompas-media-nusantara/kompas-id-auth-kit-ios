# ===================================================================
# 🎨 XAuthUIKit Module Configuration
# ===================================================================
# Modul ini bertanggung jawab atas UI, komponen visual, transisi,
# dan seluruh asset visual (Fonts, Colors, Images) otentikasi.
# Modul ini dilarang mengurus logika bisnis core secara mandiri.
# ===================================================================

targets:

  ############
  # Framework
  ############
  
  XAuthUIKit:
    name: XAuthUIKit
    # Menggunakan template dari project.yml untuk menghindari penulisan platform/type/script SwiftLint
    templates:
      - CommonFramework

    settings:
      base:
        # File info plist kustom khusus modul ini
        INFOPLIST_FILE: XAuthUIKit/Configs/Info.plist

    # Catatan: Modul UI tidak memiliki dependensi balik ke modul bisnis untuk mencegah circular dependencies.
    # dependencies:
    #   - target: XAuthKit
    
    sources:
      # Sumber berkas kode dan aset modul ini
      - path: Sources
        group: Modules/XAuthUIKit
      - path: Resources
        group: Modules/XAuthUIKit
      - path: Configs/Info.plist
        group: Modules/XAuthUIKit
      - path: Configs/xcconfig
        group: App/Configs

    # Menggunakan xcconfig file eksternal untuk konfigurasi flag build per skema
    configFiles:
      Staging Debug: Configs/xcconfig/Staging-Debug.xcconfig
      Staging Release: Configs/xcconfig/Staging-Release.xcconfig
      Production Debug: Configs/xcconfig/Production-Debug.xcconfig
      Production Release: Configs/xcconfig/Production-Release.xcconfig